name: Ajusta caminho do Drive (temporario)

# Troca Sync/Fraport -> Sync/05_Work/Fraport nos arquivos do robo. Roda uma vez e e removido depois.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  ajusta:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Trocar o caminho
        run: |
          set -e
          sed -i 's|Sync/Fraport|Sync/05_Work/Fraport|g' robo/comum.py robo/gerar_links.py robo/carrega_bigquery.py
          grep -n "05_Work" robo/comum.py robo/gerar_links.py robo/carrega_bigquery.py
          if grep -n "Sync/Fraport" robo/*.py; then echo "sobrou referencia antiga"; exit 1; fi
          python3 -m py_compile robo/comum.py robo/gerar_links.py robo/carrega_bigquery.py

      - name: Commit
        run: |
          git config user.name  "robo-anac"
          git config user.email "actions@github.com"
          git add robo/comum.py robo/gerar_links.py robo/carrega_bigquery.py
          git commit -m "caminho do Drive: Sync/05_Work/Fraport (estrutura nova)"
          git pull --rebase --autostash || true
          git push
